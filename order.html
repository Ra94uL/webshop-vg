<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/order.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
  
</head>

<body class="bg-dark d-flex flex-column min-vh-100">

        <header class="text-bg-dark p-3">

        <nav class="my-nav d-flex justify-content-between align-items-center">

            <h3 class="m-0">Webshop</h3>

            <div class="d-flex gap-4">
            <a href="index.html">Home</a>
            <a href="top-navigation/aboutUs.html">About Us</a>
            <a href="top-navigation/contactUs.html">Contact Us</a>
            </div>
            
        </nav>

    </header>

    <main class="container mt-5 text-white ms-2 mt-4 text-start">

        <div id="product"></div>

        <form action="top-navigation/thankyou.html" id="orderForm">
            <h3 class="text-start">order</h3>
            
            <label for="f-name">Full name</label>
            <input type="text" id="f-name" name="f-name" class="form-control" placeholder="Jan Erik" required>

            <label for="f-phone">Phone</label>
            <input type="tel" id="f-phone" name="f-phone" class="form-control" placeholder="(0046)70-1234567" required>

            <label for="f-email">Email</label>
            <input type="email" id="f-email" name="f-email" class="form-control" placeholder="email@gmail.com" required>

            <label for="f-street">Street</label>
            <input type="text" id="f-street" name="f-street" class="form-control" placeholder="gatan 91" required>

            <label for="f-zipcode">Zipcode</label>
            <input type="text" id="f-zipcode" name="f-zipcode" class="form-control" placeholder="14758" required>

            <label for="f-city">City</label>
            <input type="text" id="f-city" name="f-city" class="form-control" placeholder="Stockholm" required>
            <br>
            <button type="submit" class="btn btn-primary">CONFIRM ORDER</button>




        </form>

    </main>

    <footer class="container-fluid bg-dark text-white text-center py-3 mt-auto">
        <p class="m-0">© 2026 Webshop</p>


    </footer>
    
</body>
</html>
